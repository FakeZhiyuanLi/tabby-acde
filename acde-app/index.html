<!doctype html>
<!-- Same structure as Tabby's app/index.pug, with the web build's preload and bundle as classic scripts. -->
<html class="tabby">
  <head>
    <meta charset="utf-8" />
    <title>Tabby</title>
    <script>
      // zone.js wraps these classes by copying the instance's enumerable members. acdert defines
      // their methods (observe(), readAsText()...) as non-enumerable class methods, unlike WebIDL,
      // so the wrappers would have none of them: Polymer, xterm.js and acde's own frame code break.
      // Keep the runtime's classes unpatched.
      window.__Zone_disable_MutationObserver = true
      window.__Zone_disable_IntersectionObserver = true
      window.__Zone_disable_FileReader = true

      // acdert's classList.toggle(token, null) flips the class; browsers convert the second argument
      // to a boolean, so null means "remove". Tabby passes null when no split pane is maximized, and
      // each relayout dimmed or undimmed every pane (opacity .1) until the next click.
      const toggleToken = DOMTokenList.prototype.toggle
      DOMTokenList.prototype.toggle = function (token, force) {
        return force === undefined ? toggleToken.call(this, token) : toggleToken.call(this, token, !!force)
      }
    </script>
    <script src="/tabby/preload.js"></script>
    <script>
      // Tabby's web preload reports macOS. acde behaves like Linux on every host (user agent,
      // Ctrl editing shortcuts), so match it for Tabby's platform checks and default hotkeys.
      window.process.platform = 'linux'
    </script>
    <script src="/tabby/bundle.js"></script>
  </head>
  <body>
    <style id="custom-css"></style>
    <root></root>
    <app-root>
      <div class="preload-logo">
        <div>
          <div class="tabby-logo"></div>
          <h1 class="tabby-title">Tabby<sup>α</sup></h1>
          <div class="progress"><div class="bar" style="width: 0%"></div></div>
        </div>
      </div>
    </app-root>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
